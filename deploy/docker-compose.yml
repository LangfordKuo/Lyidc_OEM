# Lyidc_OEM 一键部署编排（MySQL 5.7 + 后端 + 前端）。
#
# 首次使用：
#   cd deploy
#   cp .env.example .env      # 至少改掉 MYSQL_ROOT_PASSWORD
#   docker compose up -d
#   # 浏览器打开 http://<主机>:8088/install ，按向导 6 步完成安装
#   #   第 2 步「数据库」：主机填 mysql（服务名）、端口 3306、用户 root、
#   #                     口令填 .env 里的 MYSQL_ROOT_PASSWORD、数据库名 lyidc、勾选自动建库
#
# 升级：docker compose pull && docker compose up -d（数据在命名卷里，不会丢）
# 细节与故障排查：docs/deploy.md

name: lyidc-oem

services:
  mysql:
    image: mysql:5.7
    restart: unless-stopped
    # utf8mb4：业务表统一用该字符集（见 backend/migrations）。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 里设置 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ 交给容器内 shell 展开，避免 compose 提前插值。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 默认不对外暴露 3306：后端经 compose 网络直连（主机名 mysql）。
    # 需要本机用客户端连进去调试时，取消下面两行注释。
    # ports:
    #   - "127.0.0.1:3306:3306"

  backend:
    image: ${LYIDC_BACKEND_IMAGE:-ghcr.io/langfordkuo/lyidc-oem-backend:latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 配置（安装向导写入 config.yaml）与运行数据都落在这个卷里。
      - backend-data:/app/data
    # 健康检查在 Dockerfile.backend 里定义：
    #   已安装 → /api/v1/health 200；未安装（安装向导模式）→ /install/api/status 200。
    # 因此首启未安装时 backend 也是 healthy，下面 frontend 的 service_healthy 依赖不会卡住。
    # 默认不把 8080 暴露到主机：浏览器统一经前端 8088 访问 /api/v1 与 /install。
    # 需要直连后端调试时，取消下面两行注释。
    # ports:
    #   - "127.0.0.1:8080:8080"

  frontend:
    image: ${LYIDC_FRONTEND_IMAGE:-ghcr.io/langfordkuo/lyidc-oem-frontend:latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # 反代目标：compose 服务名。改成别的地址能起来但会 502（见 docs/deploy.md）。
      BACKEND_UPSTREAM: http://backend:8080
    ports:
      - "${LYIDC_HTTP_PORT:-8088}:80"

volumes:
  mysql-data:
  backend-data:
