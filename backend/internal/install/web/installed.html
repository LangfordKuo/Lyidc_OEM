<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统已安装 · Lyidc_OEM</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f4f4f5; color: #18181b; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    max-width: 560px; width: 100%; background: #fff; border: 1px solid #e4e4e7;
    border-radius: 16px; padding: 28px; box-shadow: 0 8px 32px -20px rgba(0,0,0,.4);
    font-size: 14px; line-height: 1.7;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px;
    background: #e8faf0; color: #166534; font-size: 12.5px; font-weight: 700; margin-bottom: 14px;
  }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: #52525b; margin: 0 0 10px; }
  code { background: #f4f4f5; border-radius: 6px; padding: 1px 6px; }
  .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  a.button {
    display: inline-block; padding: 9px 18px; border-radius: 12px; font-weight: 600;
    text-decoration: none; background: #006FEE; color: #fff;
  }
  a.button.ghost { background: #fff; color: #18181b; border: 1px solid #e4e4e7; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">✓ 已安装</div>
    <h1>系统已安装，安装向导已关闭</h1>
    <p>{{.Detail}}</p>
    <p>安装向导为一次性流程：为避免重装覆盖数据，<code>/install</code> 与全部安装接口（<code>/install/api/*</code>）已永久关闭。如需重新安装，请先清空数据库（删除库或删表）后重启服务。</p>
    <p>配置文件：<code>{{.ConfigPath}}</code></p>
    <div class="actions">
      <a class="button" href="/api/v1/health">查看健康检查</a>
      <a class="button ghost" href="/">返回站点首页</a>
    </div>
  </div>
</body>
</html>
