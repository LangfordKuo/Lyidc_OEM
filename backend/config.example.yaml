# Lyidc_OEM 后端配置示例。
# 使用方法：复制为 backend/config.yaml（该文件已被 .gitignore 忽略），按本地环境修改。

server:
  # HTTP 服务监听地址（host:port）
  addr: "127.0.0.1:8080"
  # gin 运行模式：debug | release | test
  mode: "release"

database:
  # MySQL 5.7 连接串（DSN），multiStatements 供迁移使用
  dsn: "root:lyidc123@tcp(127.0.0.1:3306)/lyidc?charset=utf8mb4&parseTime=true&loc=Local&multiStatements=true"
  # 连接池参数
  max_open_conns: 25
  max_idle_conns: 5
  # 连接最长存活时间，支持 Go duration 写法（如 30m、1h）
  conn_max_lifetime: 1h

jwt:
  # JWT（HS256）签名密钥：会员与管理员 token 共用，用 aud 区分。
  # 警告：以下是开发默认值，生产环境必须改成足够随机的强密钥（建议 32 字节以上），
  #       否则任何人都能伪造 token；服务启动时若检测到仍是该默认值会打印告警日志。
  secret: "lyidc-dev-secret-change-me"
  # token 有效期（小时），缺省 168 = 7 天，取值 1-8760。
  expire_hours: 168

log:
  # 日志级别：debug | info | warn | error
  level: "info"
  # 日志格式：text | json
  format: "text"

upstream:
  # 上游「魔方财务系统」对接配置（阶段 2，契约见 docs/api-contract.md 第 8、9 节）。
  # 三项全部留空 = 不启用上游对接：服务照常启动，仅 /api/v1/admin/upstream/health 报告未配置。
  # 接口地址：上游魔方财务系统的访问地址（带 http(s)://，不要以 / 结尾），如 https://lyew.com
  base_url: ""
  # 上游账号：手机号或邮箱。
  # 注意：上游对 username 有 4-20 字符的硬校验，超过 20 字符的邮箱会被上游拒绝（见契约 8.5）。
  username: ""
  # API 密钥：上游前台「安全中心 → API」生成的 12 位密钥（不是登录密码）。
  # 安全要求：真实密钥只写在本地 config.yaml（已 gitignore）或由系统设置下发，
  #          禁止写入本示例文件、任何入库文件、日志与工单。
  api_key: ""
  # 单次上游请求超时（秒），缺省 5，取值 1-120。
  timeout_seconds: 5
