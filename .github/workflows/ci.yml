name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (go vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lyidc_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # 账号体系集成测试（httptest + 真实 MySQL 5.7）使用的测试库 DSN
      LYIDC_TEST_DSN: "root:root@tcp(127.0.0.1:3306)/lyidc_test?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt 检查
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请执行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt 检查通过"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  frontend:
    name: Frontend (tsc + build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: 类型检查（tsc --noEmit）
        run: npx tsc --noEmit

      - name: 生产构建
        run: npm run build

      - name: 单元测试（vitest）
        run: npx vitest run
